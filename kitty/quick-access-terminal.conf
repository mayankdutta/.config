# Quick-access terminal (toggled with cmd+shift+backslash, see map.conf).

# Opacity has its own default here (0.85) and ignores kitty.conf's value.
background_opacity 1

# Slide in from the bottom of the screen; height stays at the default 25 rows.
edge bottom
lines 25

# Load the normal config first (fonts, maps), then layer everforest on top
# so it overrides the kanagawa colours that ui.conf includes.
kitty_conf kitty.conf
kitty_conf themes/everforest.conf
